# Per-OS Hyprland fragment — Ubuntu side.
# Symlinked to ~/.config/hypr/os.conf by bootstrap-linux.sh; Arch's twin is
# os-arch.conf. ONLY distro- or version-specific config lives here —
# everything shared stays in hyprland.conf (one file, both OSes).
#
# Hyprland here is 0.53.x (frozen for the LTS) vs Arch's rolling 0.55.x —
# park any syntax shims for that version gap here, never in hyprland.conf.

# App launcher — rofi until walker/elephant are built from source
# (see ~/montressor/packages/ubuntu-manual.md), then flip this to walker.
$menu = rofi -show drun

# No hyprpm here: plugins need hyprland headers; the sole plugin
# (split-monitor-workspaces) is disabled anyway.
